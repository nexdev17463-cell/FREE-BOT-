name: Mass Report Bot 24/7

on:
  push:
    branches: [Test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate required configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = ("BOT_TOKEN", "API_ID", "API_HASH", "MONGO_URI")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              print("Missing required GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)

          try:
              api_id = int(os.environ["API_ID"])
              if api_id <= 0:
                  raise ValueError
          except ValueError:
              print("API_ID must be a positive integer.")
              sys.exit(1)

          print("Required configuration is present.")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
        run: python bot.py
